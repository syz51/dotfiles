# Setups on both Macs and who owns each one. Agents file friction with
# `board feedback --about <id>` (or the `feedback` MCP tool), using an id below; the
# feedback board's triage routes each report to the owner named here. Check it with
# `bun ~/.claude/factory/cli.js setups --check`.
#
# Fields: id (the `about` slug, [a-z0-9:_-], at most 40 characters), title, covers
# (repository paths, which --check requires to exist, or a phrase with spaces naming
# what it is), owner (repo, board, optional parent task; board "<project>" means the
# board of the project the report came from), channel (board, or skill-notes for skills
# that keep their own feedback capture), change (how a change is made and reviewed) and
# verify (commands).

[[setup]]
id = "board"
title = "Work board (agent-board)"
covers = ["the board server, CLI, MCP tools, hooks and coordinator prompts", "claude/hooks/board-hook.sh"]
owner = { repo = "github.com/syz51/agent-board", board = "agent-board" }
channel = "board"
change = "A PR on agent-board; deploy the server and reinstall `board` on both Macs"
verify = ["cargo test --workspace --locked", "board status"]

[[setup]]
id = "instructions"
title = "Agent instructions"
covers = ["claude/CLAUDE.md", "codex/AGENTS.md", "claude/frontend-avoid.md", "CLAUDE.md"]
owner = { repo = "github.com/syz51/dotfiles", board = "dotfiles" }
channel = "board"
change = "A PR on dotfiles keeping claude/CLAUDE.md and codex/AGENTS.md identical; the live suites when behavior changes"
verify = ["bun test claude/tests/config.test.js"]

[[setup]]
id = "agents"
title = "Claude Code subagents"
covers = ["claude/agents"]
owner = { repo = "github.com/syz51/dotfiles", board = "dotfiles" }
