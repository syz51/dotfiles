# Example `[telemetry]` and `[schedules]` snippet for `~/.local/share/agent-board/config.toml`.
# Copy and customize per host (private host snippets live in `~/.config/local/telemetry-schedules.<host>.toml` when present).
# Streamed automatically every 60s by `board watch` and on demand via `POST /v1/health/refresh`.

[telemetry]
enabled = true
interval_secs = 60
ttl_secs = 300
tailscale = true
launchd_services = [
  "dev.agent-board.watch",
  "ninja.kunobi.kache",
]

[telemetry.version_probes]
t3code = ["defaults", "read", "/Applications/T3 Code (Beta).app/Contents/Info.plist", "CFBundleShortVersionString"]

[schedules]
enabled = true
launchd = true
# Replace <HOME> with your local $HOME path when copying into ~/.local/share/agent-board/config.toml.
t3_state_db = "<HOME>/.t3/userdata/statev2.sqlite"
launchd_exclude = [
  "dev.agent-board.watch",
  "ninja.kunobi.kache",
]

[schedules.categories]
"claude-factory.friction" = "agent_ops"
"claude-factory.weekly" = "agent_ops"
"agent-skills" = "agent_ops"
"config-sync" = "sync"
"disk-space" = "monitoring"
"gnotebook-monitor" = "research"
