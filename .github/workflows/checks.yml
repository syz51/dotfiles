name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Portable tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-bun caches the Bun binary itself with actions/cache, keyed by its download
      # URL, which holds the version, OS and architecture. It checks the cached binary's
      # version and downloads only on a cache miss.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # setup-uv looks in the runner tool cache before it downloads, and enable-cache
      # caches only uv's package cache, not uv itself. So restore uv's tool-cache folder,
      # and a warm cache needs no download when GitHub's release host fails. As for
      # gitleaks, a slow cache service gives up after one minute and setup-uv downloads.
      - name: Restore uv
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.tool_cache }}/uv/0.13.5
          key: uv-0.13.5-${{ runner.os }}-${{ runner.arch }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        id: setup-uv
        with:
          version: 0.13.5
          enable-cache: false
      # This setup-uv release has no checksum for uv 0.13.5, so it checks neither a
      # download nor a cached copy. Check both binaries against the release archives'
      # contents, whose archive checksums match the ones uv publishes.
      - name: Check uv
        shell: bash
        env:
          UV_PATH: ${{ steps.setup-uv.outputs.uv-path }}
          UVX_PATH: ${{ steps.setup-uv.outputs.uvx-path }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              uv_sum=7dad6047467a9d6b081c033cb3efed9ba39a4799c698d09e6cd598f3a6a32338
              uvx_sum=e34502e6f7204735483527b722dbff2a505fc28a19d8026d2eb3d179fa4a8ad9
              ;;
            x86_64)
              uv_sum=7ed737e90584ec4f77edb50f64a9c420f8f878c4e3328ca9a2ba4585ca3b80f8
              uvx_sum=504b76b1de370f21aa8738ad1784623f892ffec62252c93ac6f466f26b6cf856
              ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          printf '%s  %s\n%s  %s\n' "$uv_sum" "$UV_PATH" "$uvx_sum" "$UVX_PATH" | shasum -a 256 --check
          version=$("$UV_PATH" --version)
          echo "$version"
          [[ "$version" == "uv 0.13.5 "* ]]
      # Saved only after the check, so a bad binary never reaches the cache, and before
      # the tests, so a failing test does not stop a good one from reaching it.
      - name: Save uv
        if: steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ runner.tool_cache }}/uv/0.13.5
          key: uv-0.13.5-${{ runner.os }}-${{ runner.arch }}
      # The archive name and checksum key the cache, so a warm cache needs no download
      # when GitHub's release host fails. The checksum check runs on a cached archive too.
      - name: Pick the gitleaks archive
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive=gitleaks_8.30.1_darwin_arm64.tar.gz
              checksum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
              ;;
            x86_64)
              archive=gitleaks_8.30.1_darwin_x64.tar.gz
              checksum=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
              ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          {
            echo "archive=$archive"
            echo "checksum=$checksum"
            echo "cache=$RUNNER_TEMP/gitleaks-cache"
            echo "bin=$RUNNER_TEMP/gitleaks-bin"
          } >> "$GITHUB_OUTPUT"
      # A slow or failing cache service must not use up the job: past one minute the
      # restore gives up with a warning, and the next step downloads instead.
      - name: Restore the gitleaks archive
        id: gitleaks-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ steps.gitleaks.outputs.cache }}
          key: ${{ steps.gitleaks.outputs.archive }}-${{ steps.gitleaks.outputs.checksum }}
      - name: Fetch and check gitleaks
        shell: bash
        env:
          archive: ${{ steps.gitleaks.outputs.archive }}
          checksum: ${{ steps.gitleaks.outputs.checksum }}
          cache: ${{ steps.gitleaks.outputs.cache }}
          bin: ${{ steps.gitleaks.outputs.bin }}
        run: |
          set -euo pipefail
          # A 504 can end curl with exit 56 over HTTP/2, which plain --retry does not
          # retry, so retry every error. The download takes at most 225 seconds
          # (retry-max-time + retry-delay + max-time), which leaves the tests 6 minutes.
          if [ -f "$cache/$archive" ]; then
            echo "gitleaks archive: cache hit"
          else
            echo "gitleaks archive: cache miss, downloading"
            mkdir -p "$cache"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 15 --retry-max-time 90 --retry-all-errors \
              --connect-timeout 15 --speed-limit 100000 --speed-time 20 --max-time 120 \
              "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
              --output "$cache/$archive"
          fi
          (cd "$cache" && printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check)
          mkdir -p "$bin"
          tar -xzf "$cache/$archive" -C "$bin" gitleaks
      # Saved right after the checksum check, so a failing test later in the job does
      # not stop a good archive from reaching the cache.
      - name: Save the gitleaks archive
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: ${{ steps.gitleaks.outputs.cache }}
          key: ${{ steps.gitleaks.outputs.archive }}-${{ steps.gitleaks.outputs.checksum }}
      - name: Scan history and run isolated tests
        shell: bash
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.bin }}/gitleaks
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "${TMPDIR%/}/dotfiles-checks.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          export TMPDIR="$scratch"
          export PYTHONDONTWRITEBYTECODE=1
          "$GITLEAKS" git --redact=100 --max-decode-depth=2 --log-opts="--all"
          uv python install 3.13
          bun test nvim/tests/bun-outdated.test.js nvim/tests/protect-skim-notes.test.js claude/hooks claude/tests claude/factory claude/marketplace
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s tuios/tests -v
          uv run --offline --no-project --python 3.13 python -B ghostty/test-tuios-launcher.py -v
          uv run --offline --no-project --python 3.13 python -B shell/test-startup-fixes.py -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s t3code/tests -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s disk-alert/tests -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s config-sync/tests -v
