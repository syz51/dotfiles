name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Portable tests
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: 0.13.5
          enable-cache: false
      # The archive name and checksum key the cache, so a warm cache needs no download
      # when GitHub's release host fails. The test step checks the checksum either way.
      - name: Pick the gitleaks archive
        id: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              archive=gitleaks_8.30.1_darwin_arm64.tar.gz
              checksum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5
              ;;
            x86_64)
              archive=gitleaks_8.30.1_darwin_x64.tar.gz
              checksum=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
              ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          { echo "archive=$archive"; echo "checksum=$checksum"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gitleaks-cache
          key: ${{ steps.gitleaks.outputs.archive }}-${{ steps.gitleaks.outputs.checksum }}
      - name: Scan history and run isolated tests
        shell: bash
        env:
          GITLEAKS_ARCHIVE: ${{ steps.gitleaks.outputs.archive }}
          GITLEAKS_CHECKSUM: ${{ steps.gitleaks.outputs.checksum }}
          GITLEAKS_CACHE: ${{ runner.temp }}/gitleaks-cache
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "${TMPDIR%/}/dotfiles-checks.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          export TMPDIR="$scratch"
          export PYTHONDONTWRITEBYTECODE=1
          archive=$GITLEAKS_ARCHIVE
          checksum=$GITLEAKS_CHECKSUM
          # A 504 can surface as exit 56 over HTTP/2, so retry every error, within about
          # 3.5 minutes in all to leave the 10-minute job time for the tests.
          if [ -f "$GITLEAKS_CACHE/$archive" ]; then
            echo "gitleaks archive: cache hit"
          else
            echo "gitleaks archive: cache miss, downloading"
            mkdir -p "$GITLEAKS_CACHE"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 15 --retry-max-time 150 --retry-all-errors \
              --connect-timeout 15 --max-time 60 \
              "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive" \
              --output "$GITLEAKS_CACHE/$archive"
          fi
          # The checksum check runs on the copy in the scratch folder, downloaded or cached.
          cp "$GITLEAKS_CACHE/$archive" "$scratch/$archive"
          (cd "$scratch" && printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check)
          tar -xzf "$scratch/$archive" -C "$scratch" gitleaks
          "$scratch/gitleaks" git --redact=100 --max-decode-depth=2 --log-opts="--all"
          uv python install 3.13
          bun test nvim/tests/bun-outdated.test.js nvim/tests/protect-skim-notes.test.js claude/hooks claude/tests claude/factory claude/marketplace
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s tuios/tests -v
          uv run --offline --no-project --python 3.13 python -B ghostty/test-tuios-launcher.py -v
          uv run --offline --no-project --python 3.13 python -B shell/test-startup-fixes.py -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s t3code/tests -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s disk-alert/tests -v
          uv run --offline --no-project --python 3.13 python -B -m unittest discover -s config-sync/tests -v
